<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RoutineParent{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Georgia, 'Times New Roman', serif;
            color: #2c2c2c;
            background-color: #faf9f6;
            line-height: 1.8;
        }

        /* Navigation */
        nav {
            background-color: #fff;
            border-bottom: 1px solid #e8e4df;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c2c2c;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        nav .logo span { color: #7c956a; }

        nav .nav-links { display: flex; gap: 1.5rem; list-style: none; }

        nav .nav-links a {
            text-decoration: none;
            color: #666;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        nav .nav-links a:hover { color: #7c956a; }

        /* Main Content */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Post Cards */
        .post-card {
            background: #fff;
            border: 1px solid #e8e4df;
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            transition: box-shadow 0.2s;
        }

        .post-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }

        .post-card h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }

        .post-card h2 a { color: #2c2c2c; text-decoration: none; }

        .post-card h2 a:hover { color: #7c956a; }

        .post-meta {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 1rem;
        }

        .post-meta .pillar {
            background: #f0ebe3;
            color: #7c956a;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .post-excerpt { color: #555; }

        .read-more {
            display: inline-block;
            margin-top: 1rem;
            color: #7c956a;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .read-more:hover { text-decoration: underline; }

        /* Post Detail */
        .post-detail h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .post-detail .subtitle {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 1rem;
        }

        .post-body { margin-top: 2rem; }

        .post-body p { margin-bottom: 1.2rem; }

        /* Tags */
        .tags { margin-top: 1.5rem; }

        .tag {
            display: inline-block;
            background: #f0ebe3;
            color: #7c956a;
            padding: 0.2rem 0.7rem;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 0.4rem;
            text-decoration: none;
        }

        .tag:hover { background: #e4ddd3; }

        /* Page Header */
        .page-header {
            text-align: center;
            padding: 3rem 0 2rem;
        }

        .page-header h1 { font-size: 2rem; margin-bottom: 0.3rem; }

        .page-header p { color: #888; font-size: 1.05rem; }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
            border-top: 1px solid #e8e4df;
            color: #999;
            font-size: 0.85rem;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <a href="{% url 'blog:post_list' %}" class="logo">The Routine<span>Parent</span></a>
        <ul class="nav-links">
            <li><a href="{% url 'blog:post_list' %}">Home</a></li>
            <li><a href="{% url 'blog:pillar_posts' 'parent-productivity' %}">Productivity</a></li>
            <li><a href="{% url 'blog:pillar_posts' 'raising-independent-kids' %}">Raising Kids</a></li>
            <li><a href="{% url 'blog:pillar_posts' 'personal-growth-for-parents' %}">Personal Growth</a></li>
            <li><a href="{% url 'blog:pillar_posts' 'real-life-systems' %}">Systems</a></li>
            <li><a href="{% url 'blog:about' %}">About</a></li>
        </ul>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>&copy; 2026 The Routine Parent — Productivity for Modern Parents</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
